<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayLine — Painel de Controle</title>
  <link rel="icon" type="image/png" href="/api/logos/FavPlayline.png" />
  <link rel="stylesheet" href="/static/styles/base.css" />
  <link rel="stylesheet" href="/static/styles/layout.css" />
  <link rel="stylesheet" href="/static/styles/player.css" />
  <link rel="stylesheet" href="/static/styles/schedule.css" />
  <link rel="stylesheet" href="/static/styles/library.css" />
  <link rel="stylesheet" href="/static/styles/log.css" />
  <link rel="stylesheet" href="/static/styles/text_overlay.css" />
</head>
<body>
  <header>
    <div class="logo"><img src="/api/logos/LogoPlayLineD.png" alt="PlayLine" /></div>
    <div class="conn-status">
      <span class="dot" id="dot"></span>
      <span id="conn-label">Desconectado</span>
    </div>
  </header>

  <main>
    <div class="left-col">
      
      <section class="card" id="now-playing-card">
        <h2>Reproduzindo agora</h2>
        <div class="player-wrap">
          <canvas id="mpv-preview"></canvas>
          <video id="player-video" muted></video>
          <img id="logo-overlay-1" class="logo-overlay" style="display:none" alt="" draggable="false" />
          <img id="logo-overlay-2" class="logo-overlay" style="display:none" alt="" draggable="false" />
          <div id="text-preview-overlay" class="text-preview-overlay" style="display:none"></div>
        </div>
        <div class="now-playing-title" id="np-title">—</div>
        <div class="progress-wrap">
          <span id="pos">0:00</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span id="dur">0:00</span>
        </div>
        <div class="state-badge" id="state-badge">parado</div>
      </section>

      <section class="card library-card">
        <div class="library-header">
          <h2>Biblioteca</h2>
          <div class="library-folder-row">
            <input id="library-folder-input" type="text" placeholder="Ex: C:\Videos" />
            <button id="btn-load-library" title="Carregar pasta">↺</button>
          </div>
        </div>
        <div class="library-list" id="library-list">
          <div class="empty">Informe o caminho de uma pasta acima</div>
        </div>
      </section>

    </div>

    <div class="right-col">
      
      <section class="card controls-card">
        <h2>Painel de Controle</h2>
        <div class="control-stats">
          <div class="stat-block">
            <div class="stat-label">Tempo restante</div>
            <div class="stat-value stat-remaining" id="remaining-time">—</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-block stat-block--clock">
            <div class="stat-label" id="clock-date">—</div>
            <div class="stat-value stat-clock" id="clock-time">—</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-block">
            <div class="stat-label">Próximo clipe às</div>
            <div class="stat-value stat-next" id="next-clip-time">—</div>
          </div>
        </div>
        <div class="controls-row">

          <div class="audio-controls">
            <span class="audio-label">Volume</span>
            <div class="audio-row">
              <button id="btn-mute" class="btn-mute" title="Mudo">🔊</button>
              <div class="fader-wrap">
                <input type="range" id="volume-slider" min="-10" max="3" step="0.5" value="0" />
                <div class="volume-scale">
                  <!-- left = calc(15px + P*(100%-30px)), P=(val+10)/13 -->
                  <span style="left:15px">-10</span>
                  <span style="left:calc(38.5% + 3.5px)">-5</span>
                  <span style="left:calc(76.9% - 8px)">0</span>
                  <span style="left:calc(100% - 15px)">+3</span>
                </div>
              </div>
              <span class="volume-db" id="volume-db">0 dB</span>
            </div>
            <div class="vu-wrap">
              <canvas id="vu-canvas" height="10"></canvas>
              <span class="vu-clip" id="vu-clip">CLIP</span>
            </div>
          </div>

          <div class="controls">
            <button id="btn-stop"  title="Parar">⏹</button>
            <button id="btn-play"  title="Play">▶</button>
            <button id="btn-pause" title="Pausar">⏸</button>
            <button id="btn-next"  title="Próximo">⏭</button>
          </div>

          <div class="logo-controls-compact">

            <div class="logo-ctrl">
              <span class="logo-label">Logo 1</span>
              <div class="logo-pos-selector" data-slot="1">
                <div class="pos-zone" data-slot="1" data-corner="tl" title="Superior esquerdo"></div>
                <div class="pos-zone" data-slot="1" data-corner="tr" title="Superior direito"></div>
                <div class="pos-zone" data-slot="1" data-corner="bl" title="Inferior esquerdo"></div>
                <div class="pos-zone" data-slot="1" data-corner="br" title="Inferior direito"></div>
                <div class="pos-indicator"></div>
              </div>
              <div class="logo-toggle-wrap">
                <button class="btn-logo-toggle" data-slot="1" title="Ativar logo 1">⏻</button>
                <button class="btn-logo-pick" data-slot="1" title="Selecionar logo">▾</button>
                <div class="logo-picker-dropdown" id="logo-picker-1"></div>
              </div>
            </div>

            <div class="logo-ctrl">
              <span class="logo-label">Logo 2</span>
              <div class="logo-pos-selector" data-slot="2">
                <div class="pos-zone" data-slot="2" data-corner="tl" title="Superior esquerdo"></div>
                <div class="pos-zone" data-slot="2" data-corner="tr" title="Superior direito"></div>
                <div class="pos-zone" data-slot="2" data-corner="bl" title="Inferior esquerdo"></div>
                <div class="pos-zone" data-slot="2" data-corner="br" title="Inferior direito"></div>
                <div class="pos-indicator"></div>
              </div>
              <div class="logo-toggle-wrap">
                <button class="btn-logo-toggle" data-slot="2" title="Ativar logo 2">⏻</button>
                <button class="btn-logo-pick" data-slot="2" title="Selecionar logo">▾</button>
                <div class="logo-picker-dropdown" id="logo-picker-2"></div>
              </div>
            </div>

            <div class="text-ctrl">
              <span class="logo-label">Hora / Temp.</span>
              <div id="text-pos-selector">
                <div class="pos-zone" data-corner="tl" title="Superior esquerdo"></div>
                <div class="pos-zone" data-corner="tr" title="Superior direito"></div>
                <div class="pos-zone" data-corner="bl" title="Inferior esquerdo"></div>
                <div class="pos-zone" data-corner="br" title="Inferior direito"></div>
                <div class="pos-indicator"></div>
              </div>
              <div class="logo-toggle-wrap">
                <button class="btn-text-toggle btn-logo-toggle" id="btn-text-toggle" title="Ativar hora/temperatura">⏻</button>
                <button class="btn-logo-pick" id="btn-text-pick" title="Selecionar itens">▾</button>
                <div class="logo-picker-dropdown" id="text-picker-dropdown">
                  <div class="logo-picker-item" id="pick-time">
                    <span class="logo-picker-check" id="pick-time-check">✓</span>
                    <span class="logo-picker-name">Hora</span>
                  </div>
                  <div class="logo-picker-item" id="pick-temp">
                    <span class="logo-picker-check" id="pick-temp-check">✓</span>
                    <span class="logo-picker-name">Temp.</span>
                  </div>
                </div>
              </div>
            </div>

          </div>

        </div>

      </section>

      <div class="schedule-wrapper">
        <section class="card schedule-card">
          <div class="schedule-header">
            <h2>Roteiro</h2>
            <div class="schedule-actions"></div>
          </div>
          <div class="schedule-list" id="schedule-list">
            <div class="empty">Carregando roteiro…</div>
          </div>
        </section>
      </div>

    </div>

    <section class="card log-card collapsed" id="log-section">
      <div class="log-header">
        <h2>Log de eventos</h2>
        <div class="log-actions">
          <button id="btn-clear-log">Limpar</button>
          <button id="btn-toggle-log" title="Expandir/Recolher">▲</button>
        </div>
      </div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <div id="confirm-modal" class="confirm-modal-backdrop" style="display:none">
    <div class="confirm-modal-box">
      <p id="confirm-modal-text"></p>
      <div class="confirm-modal-actions">
        <button id="confirm-modal-cancel">Cancelar</button>
        <button id="confirm-modal-ok" class="confirm-modal-danger">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="/static/components/logs.js"></script>
  <script src="/static/components/player.js"></script>
  <script src="/static/components/playlist.js"></script>
  <script src="/static/components/library.js"></script>
  <script src="/static/core/ws.js"></script>
  <script src="/static/components/text_overlay.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/components/preview_ws.js"></script>
</body>
</html>
