<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayLine — Painel de Controle</title>
  <link rel="stylesheet" href="/static/styles/base.css" />
  <link rel="stylesheet" href="/static/styles/layout.css" />
  <link rel="stylesheet" href="/static/styles/player.css" />
  <link rel="stylesheet" href="/static/styles/schedule.css" />
  <link rel="stylesheet" href="/static/styles/library.css" />
  <link rel="stylesheet" href="/static/styles/log.css" />
</head>
<body>
  <header>
    <div class="logo">PlayLine</div>
    <div class="conn-status">
      <span class="dot" id="dot"></span>
      <span id="conn-label">Desconectado</span>
    </div>
  </header>

  <main>
    <div class="left-col">
      
      <section class="card" id="now-playing-card">
        <h2>Reproduzindo agora</h2>
        <video id="player-video" muted></video>
        <div class="now-playing-title" id="np-title">—</div>
        <div class="progress-wrap">
          <span id="pos">0:00</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span id="dur">0:00</span>
        </div>
        <div class="state-badge" id="state-badge">parado</div>
      </section>

      <section class="card library-card">
        <div class="library-header">
          <h2>Biblioteca</h2>
          <div class="library-folder-row">
            <input id="library-folder-input" type="text" placeholder="Ex: C:\Videos" />
            <button id="btn-load-library" title="Carregar pasta">↺</button>
          </div>
        </div>
        <div class="library-list" id="library-list">
          <div class="empty">Informe o caminho de uma pasta acima</div>
        </div>
      </section>

    </div>

    <div class="right-col">
      
      <section class="card controls-card">
        <h2>Painel de Controle</h2>
        <div class="control-stats">
          <div class="stat-block">
            <div class="stat-label">Tempo restante</div>
            <div class="stat-value stat-remaining" id="remaining-time">—</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-block">
            <div class="stat-label">Próximo clipe às</div>
            <div class="stat-value stat-next" id="next-clip-time">—</div>
          </div>
        </div>
        <div class="controls">
          <button id="btn-stop"  title="Parar">⏹</button>
          <button id="btn-play"  title="Play">▶</button>
          <button id="btn-pause" title="Pausar">⏸</button>
          <button id="btn-next"  title="Próximo">⏭</button>
        </div>
      </section>

      <div class="schedule-wrapper">
        <section class="card schedule-card">
          <div class="schedule-header">
            <h2>Roteiro</h2>
            <div class="schedule-actions">
              <button id="btn-add" title="Adicionar item manualmente">+ Item</button>
            </div>
          </div>
          <div class="schedule-list" id="schedule-list">
            <div class="empty">Carregando roteiro…</div>
          </div>
        </section>
      </div>

    </div>

    <section class="card log-card collapsed" id="log-section">
      <div class="log-header">
        <h2>Log de eventos</h2>
        <div class="log-actions">
          <button id="btn-clear-log">Limpar</button>
          <button id="btn-toggle-log" title="Expandir/Recolher">▲</button>
        </div>
      </div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <script src="/static/components/logs.js"></script>
  <script src="/static/components/player.js"></script>
  <script src="/static/components/playlist.js"></script>
  <script src="/static/components/library.js"></script>
  <script src="/static/core/ws.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
