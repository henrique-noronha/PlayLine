name: Deploy GitHub Pages

# O site oficial é playlinetv.com.br, publicado pelo Cloudflare a partir de docs/.
# O GitHub Pages passou a servir apenas uma página de redirecionamento: servir o
# mesmo conteúdo nos dois endereços fazia o Google indexar o github.io (mais
# antigo) e ignorar o domínio próprio, mesmo com a tag canonical apontando para ele.
on:
  push:
    branches: [main]
    paths:
      - "docs-redirect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs-redirect"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
